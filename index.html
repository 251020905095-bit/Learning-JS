<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Photo Gallery</title>
    <style>
        #image {
            width: 100%;
            height: 300px;
            border: 2px solid #ccc;
            background-color: #f0f0f0;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            text-align: center;
            line-height: 300px;
            font-size: 20px;
            font-weight: bold;
            color: #41ff41;
            margin-bottom: 20px;
        }
        .preview {
            width: 150px;
            height: 100px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Khu vực hiển thị chính -->
    <div id="image">
        Hover over an image below to display here.
    </div>

    <!-- Các hình ảnh nhỏ để di chuột vào -->
    <img class="preview" 
         alt="Cảnh thiên nhiên đẹp"
         src="https://picsum.photos/id/1015/600/400" 
         onmouseover="upDate(this)" 
         onmouseleave="unDo()">

    <img class="preview" 
         alt="Thành phố lên đèn" 
         src="https://picsum.photos/id/1016/600/400" 
         onmouseover="upDate(this)" 
         onmouseleave="unDo()">

    <img class="preview" 
         alt="Bờ biển hoàng hôn" 
         src="https://picsum.photos/id/1018/600/400" 
         onmouseover="upDate(this)" 
         onmouseleave="unDo()">

    <script src="script.js"></script>

</body>
</html>
